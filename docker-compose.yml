name: paddledoc

services:
  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PADDLEDOC_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/paddledoc
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_API_BEARER_TOKEN: ${OPENAI_API_BEARER_TOKEN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-paddledoc-encourage}
      PADDLEDOC_ENCOURAGE_ENABLE_MLFLOW_TRACING: ${PADDLEDOC_ENCOURAGE_ENABLE_MLFLOW_TRACING:-true}
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-3g}
    cpus: ${WORKER_CPUS:-2.0}
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/paddledoc
      REDIS_URL: redis://redis:6379/0
      PADDLE_DEFAULT_PROFILE: ppocrv6_tiny
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis
      # Runtime tuning for smaller ARM hosts to reduce model load spikes.
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_PREFETCH_MULTIPLIER:-1}
      CELERY_MAX_TASKS_PER_CHILD: ${CELERY_MAX_TASKS_PER_CHILD:-5}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      ONNXRUNTIME_INTRA_OP_NUM_THREADS: ${ONNXRUNTIME_INTRA_OP_NUM_THREADS:-1}
      ONNXRUNTIME_INTER_OP_NUM_THREADS: ${ONNXRUNTIME_INTER_OP_NUM_THREADS:-1}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_API_BEARER_TOKEN: ${OPENAI_API_BEARER_TOKEN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-paddledoc-encourage}
      PADDLEDOC_ENCOURAGE_ENABLE_MLFLOW_TRACING: ${PADDLEDOC_ENCOURAGE_ENABLE_MLFLOW_TRACING:-true}
    volumes:
      - ./backend/storage:/app/backend/storage
      - paddlex_models:/root/.paddlex
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - backend
      - redis

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: paddledoc
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  mlflow:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis,mlflow
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        mkdir -p /app/backend/storage/mlflow/artifacts
        mlflow ui --host 0.0.0.0 --port 5000 \
          --backend-store-uri sqlite:////app/backend/storage/mlflow/mlflow.db \
          --default-artifact-root /app/backend/storage/mlflow/artifacts
    ports:
      - '5000:5000'
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis,mlflow
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},backend,worker,postgres,redis,mlflow
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      - backend

volumes:
  pgdata:
  paddlex_models:
  hf_cache:

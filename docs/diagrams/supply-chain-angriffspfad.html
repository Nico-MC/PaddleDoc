<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomie des Lieferketten-Angriffs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-accent:  #4f46e5;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Prozess · Supply-Chain-Blueprint</p>
    <h1>Anatomie des Angriffs: vom fremden Release-Tag in die eigene Pipeline</h1>

    <svg viewBox="0 0 840 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="angriffspfad-title angriffspfad-desc">
      <title id="angriffspfad-title">Anatomie des Lieferketten-Angriffs</title>
      <desc id="angriffspfad-desc">Prozessdiagramm in drei Akteurs-Bahnen: Ein Angreifer erbeutet einen Automations-Token und vergiftet das Release eines fremden Tool-Projekts; die eigene Pipeline bezieht das Werkzeug ungeprüft als neueste Version, führt den Schadcode im Build aus, verliert Secrets, und der Angreifer verwertet die erbeuteten Zugänge.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(15,23,42,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Hintergrund -->
      <rect width="100%" height="100%" fill="#f8fafc"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lane-Tints (Lane 0 und 2) -->
      <rect x="140" y="36" width="700" height="80" fill="rgba(15,23,42,0.018)"/>
      <rect x="140" y="196" width="700" height="80" fill="rgba(15,23,42,0.018)"/>

      <!-- Lane-Trennlinien + Legendengrenze -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(15,23,42,0.20)" stroke-width="1"/>

      <!-- Schritt-Chips + Labels -->
      <rect x="190" y="8" width="16" height="16" rx="8" fill="rgba(15,23,42,0.12)"/>
      <text x="198" y="19" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <text x="198" y="32" fill="#475569" font-size="6" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ZUGANG</text>

      <rect x="302" y="8" width="16" height="16" rx="8" fill="rgba(15,23,42,0.12)"/>
      <text x="310" y="19" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="310" y="32" fill="#475569" font-size="6" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">TAG-PUSH</text>

      <rect x="414" y="8" width="16" height="16" rx="8" fill="rgba(79,70,229,0.20)"/>
      <text x="422" y="19" fill="#4f46e5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="422" y="32" fill="#4f46e5" font-size="6" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BEZUG</text>

      <rect x="526" y="8" width="16" height="16" rx="8" fill="rgba(15,23,42,0.12)"/>
      <text x="534" y="19" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <text x="534" y="32" fill="#475569" font-size="6" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BUILD</text>

      <rect x="638" y="8" width="16" height="16" rx="8" fill="rgba(15,23,42,0.12)"/>
      <text x="646" y="19" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <text x="646" y="32" fill="#475569" font-size="6" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DIEBSTAHL</text>

      <rect x="750" y="8" width="16" height="16" rx="8" fill="rgba(15,23,42,0.12)"/>
      <text x="758" y="19" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <text x="758" y="32" fill="#475569" font-size="6" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ZUGRIFF</text>

      <!-- Lane-Labels -->
      <text x="70" y="80" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANGREIFER</text>
      <text x="70" y="152" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL-</text>
      <text x="70" y="160" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROJEKT</text>
      <text x="70" y="232" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EIGENE</text>
      <text x="70" y="240" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPELINE</text>

      <!-- Pfeile (vor den Knoten) -->
      <path d="M248,76 H302 Q310,76 310,84 V124" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M360,156 H414 Q422,156 422,164 V204" fill="none" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="472" y1="236" x2="484" y2="236" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="584" y1="236" x2="596" y2="236" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M696,236 H750 Q758,236 758,228 V108" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Knoten 1: Token erbeutet (ANGREIFER, Schritt 1) -->
      <rect x="148" y="44" width="100" height="64" rx="6" fill="#f8fafc"/>
      <rect x="148" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(15,23,42,0.25)" stroke-width="1"/>
      <rect x="152" y="48" width="14" height="10" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="159" y="56" fill="#475569" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">ATK</text>
      <text x="198" y="70" fill="#0f172a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Token erbeutet</text>
      <text x="198" y="84" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Automations-Token</text>
      <text x="198" y="96" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">gültig trotz Rotation</text>

      <!-- Knoten 2: Release vergiftet (TOOL-PROJEKT, Schritt 2) -->
      <rect x="260" y="124" width="100" height="64" rx="6" fill="#f8fafc"/>
      <rect x="260" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(15,23,42,0.25)" stroke-width="1"/>
      <rect x="264" y="128" width="14" height="10" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="271" y="136" fill="#475569" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">UPS</text>
      <text x="310" y="150" fill="#0f172a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Release vergiftet</text>
      <text x="310" y="164" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Tag → Schadcode</text>
      <text x="310" y="176" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">mutable tag</text>

      <!-- Knoten 3: Ungeprüfter Bezug (EIGENE PIPELINE, Schritt 3) — FOKAL -->
      <rect x="372" y="204" width="100" height="64" rx="6" fill="#f8fafc"/>
      <rect x="372" y="204" width="100" height="64" rx="6" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1.2"/>
      <rect x="376" y="208" width="14" height="10" rx="2" fill="rgba(79,70,229,0.18)"/>
      <text x="383" y="216" fill="#4f46e5" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">CI</text>
      <text x="422" y="230" fill="#0f172a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Ungeprüfter Bezug</text>
      <text x="422" y="244" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Pipeline lädt »latest«</text>
      <text x="422" y="256" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">kein Pin · kein Hash</text>

      <!-- Knoten 4: Schadcode läuft (EIGENE PIPELINE, Schritt 4) -->
      <rect x="484" y="204" width="100" height="64" rx="6" fill="#f8fafc"/>
      <rect x="484" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(15,23,42,0.25)" stroke-width="1"/>
      <rect x="488" y="208" width="14" height="10" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="495" y="216" fill="#475569" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">CI</text>
      <text x="534" y="230" fill="#0f172a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Schadcode läuft</text>
      <text x="534" y="244" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">im Build-Kontext</text>
      <text x="534" y="256" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">volle Pipeline-Rechte</text>

      <!-- Knoten 5: Secrets erbeutet (EIGENE PIPELINE, Schritt 5) -->
      <rect x="596" y="204" width="100" height="64" rx="6" fill="#f8fafc"/>
      <rect x="596" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(15,23,42,0.25)" stroke-width="1"/>
      <rect x="600" y="208" width="14" height="10" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="607" y="216" fill="#475569" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">CI</text>
      <text x="646" y="230" fill="#0f172a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Secrets erbeutet</text>
      <text x="646" y="244" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Cloud · Registry · Keys</text>
      <text x="646" y="256" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Env + Prozessspeicher</text>

      <!-- Knoten 6: Missbrauch (ANGREIFER, Schritt 6) -->
      <rect x="708" y="44" width="100" height="64" rx="6" fill="#f8fafc"/>
      <rect x="708" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(15,23,42,0.25)" stroke-width="1"/>
      <rect x="712" y="48" width="14" height="10" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="719" y="56" fill="#475569" font-size="6" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">ATK</text>
      <text x="758" y="70" fill="#0f172a" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Missbrauch</text>
      <text x="758" y="84" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">fälschen · verbreiten</text>
      <text x="758" y="96" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">wochenlang verwertbar</text>

      <!-- Legende -->
      <text x="144" y="296" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SCHRITTE</text>
      <text x="240" y="296" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace">1–2 beim Zulieferer · 3–5 in der eigenen Pipeline · 6 beim Angreifer</text>
      <text x="144" y="324" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FLUSS</text>
      <line x1="240" y1="320" x2="272" y2="320" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="280" y="324" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace">Ablauf</text>
      <line x1="340" y1="320" x2="372" y2="320" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="380" y="324" fill="#64748b" font-size="6.5" font-family="'Geist Mono', monospace">kritischer Übergang: der ungeprüfte Bezug — hier setzt der Blueprint an</text>
    </svg>
  </div>
</body>
</html>

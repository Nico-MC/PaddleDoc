<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="restrisiko-en-title restrisiko-en-desc">
      <title id="restrisiko-en-title">What Each Layer Catches — And What Remains</title>
      <desc id="restrisiko-en-desc">Layer diagram of risk compensation: the threat of a compromised supplier passes by the five measures M1 through M5; each layer states what it blocks and which residual path escapes it, converging on an explicit residual risk with its response — diligent review plus the extension stages signing and tag protection.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- Bedrohungs-Label oben -->
      <text x="128" y="32" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THREAT · COMPROMISED SUPPLIER</text>

      <!-- Risikofaden (gestrichelt = Transit) — vor den Boxen gezeichnet -->
      <path d="M112,40 V372 Q112,380 120,380 H156" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Schichten-Silhouette -->
      <rect x="160" y="48" width="760" height="280" rx="6" fill="#ffffff" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <line x1="160" y1="104" x2="920" y2="104" stroke="rgba(15,23,42,0.12)" stroke-width="1"/>
      <line x1="160" y1="160" x2="920" y2="160" stroke="rgba(15,23,42,0.12)" stroke-width="1"/>
      <line x1="160" y1="216" x2="920" y2="216" stroke="rgba(15,23,42,0.12)" stroke-width="1"/>
      <line x1="160" y1="272" x2="920" y2="272" stroke="rgba(15,23,42,0.12)" stroke-width="1"/>

      <!-- M1 -->
      <rect x="172" y="64" width="20" height="12" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="182" y="73" fill="#475569" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">M1</text>
      <text x="200" y="74" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Immutable references</text>
      <text x="200" y="90" fill="#475569" font-size="10" font-family="'Inter', sans-serif">blocks repointed version labels</text>
      <text x="908" y="82" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ESCAPES: ALREADY-POISONED PIN</text>

      <!-- M2 -->
      <rect x="172" y="120" width="20" height="12" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="182" y="129" fill="#475569" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">M2</text>
      <text x="200" y="130" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Tool checksums</text>
      <text x="200" y="146" fill="#475569" font-size="10" font-family="'Inter', sans-serif">blocks tampered binary downloads</text>
      <text x="908" y="138" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ESCAPES: FORGED VENDOR CHECKSUM</text>

      <!-- M3 -->
      <rect x="172" y="176" width="20" height="12" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="182" y="185" fill="#475569" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">M3</text>
      <text x="200" y="186" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Hash lock</text>
      <text x="200" y="202" fill="#475569" font-size="10" font-family="'Inter', sans-serif">blocks new and swapped package artifacts, incl. transitive</text>
      <text x="908" y="194" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ESCAPES: POISON IN LOCKED TREE</text>

      <!-- M4 -->
      <rect x="172" y="232" width="20" height="12" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="182" y="241" fill="#475569" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">M4</text>
      <text x="200" y="242" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Quality gate</text>
      <text x="200" y="258" fill="#475569" font-size="10" font-family="'Inter', sans-serif">blocks publishing unverified states</text>
      <text x="908" y="250" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ESCAPES: TESTS DO NOT TRIGGER</text>

      <!-- M5 -->
      <rect x="172" y="288" width="20" height="12" rx="2" fill="rgba(15,23,42,0.10)"/>
      <text x="182" y="297" fill="#475569" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">M5</text>
      <text x="200" y="298" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Mandatory review</text>
      <text x="200" y="314" fill="#475569" font-size="10" font-family="'Inter', sans-serif">blocks unreviewed adoption of updates</text>
      <text x="908" y="306" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ESCAPES: UNREAD REVIEW</text>

      <!-- Restrisiko (fokal) -->
      <rect x="160" y="352" width="760" height="56" rx="6" fill="#f8fafc"/>
      <rect x="160" y="352" width="760" height="56" rx="6" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="176" y="374" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif">Residual risk</text>
      <text x="176" y="392" fill="#475569" font-size="10" font-family="'Inter', sans-serif">states poisoned before freezing · reviews approved unread</text>
      <text x="908" y="382" fill="#4f46e5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">RESPONSE: REVIEW DILIGENCE · SIGNING · TAG PROTECTION</text>

      <!-- Legende -->
      <line x1="30" y1="424" x2="970" y2="424" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
      <text x="30" y="440" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="112" y1="436" x2="144" y2="436" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="152" y="440" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">risk path — narrows per layer, never reaches zero</text>
      <rect x="520" y="428" width="12" height="12" rx="2" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1"/>
      <text x="540" y="440" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">residual risk + response (focal)</text>
    </svg>

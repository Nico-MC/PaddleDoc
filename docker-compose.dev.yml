services:
  frontend:
    command:
      - sh
      - -c
      - |
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
          npm ci
        fi
        npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      PADDLEDOC_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    command:
      - sh
      - -c
      - |
        alembic upgrade head
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      RUN_ALEMBIC_ON_STARTUP: "false"
    volumes:
      - ./backend:/app

  worker:
    command:
      - sh
      - -c
      - |
        watchfiles --filter python --verbosity info \
          "celery -A app.workers.tasks worker --loglevel=${CELERY_LOG_LEVEL:-info} --pool=${CELERY_WORKER_POOL:-prefork} --concurrency=${CELERY_WORKER_CONCURRENCY:-1} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER:-1} -Ofair --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-5}" \
          /app/app
    volumes:
      - ./backend:/app
      - paddlex_models:/root/.paddlex

volumes:
  frontend_node_modules:

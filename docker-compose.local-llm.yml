services:
  backend:
    environment:
      DATASET_LLM_API_BASE_URL: http://ollama:11434/v1
      DATASET_LLM_API_KEY: ollama
      DATASET_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-0.11.11}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:${OLLAMA_TAG:-0.11.11}
    restart: 'no'
    entrypoint: ['/bin/sh', '-ec']
    command: ['ollama pull "$$MODEL" && ollama show "$$MODEL"']
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
    depends_on:
      ollama:
        condition: service_healthy

  dataset-worker:
    environment:
      DATASET_LLM_API_BASE_URL: http://ollama:11434/v1
      DATASET_LLM_API_KEY: ollama
      DATASET_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_models:
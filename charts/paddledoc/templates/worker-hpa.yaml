{{- if and .Values.worker.enabled .Values.autoscaling.worker.enabled }}
{{- if gt .Values.autoscaling.worker.minReplicas .Values.autoscaling.worker.maxReplicas }}
{{- fail "autoscaling.worker.minReplicas must be less than or equal to autoscaling.worker.maxReplicas" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "PaddleDoc.fullname" . }}-worker
  labels:
    {{- include "PaddleDoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "PaddleDoc.fullname" . }}-worker
  minReplicas: {{ .Values.autoscaling.worker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.worker.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.worker.targetCPUUtilizationPercentage }}
{{- end }}

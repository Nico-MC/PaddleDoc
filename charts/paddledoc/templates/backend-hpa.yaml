{{- if and .Values.backend.enabled .Values.autoscaling.backend.enabled }}
{{- if gt .Values.autoscaling.backend.minReplicas .Values.autoscaling.backend.maxReplicas }}
{{- fail "autoscaling.backend.minReplicas must be less than or equal to autoscaling.backend.maxReplicas" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "paddledoc.fullname" . }}-backend
  labels:
    {{- include "paddledoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "paddledoc.fullname" . }}-backend
  minReplicas: {{ .Values.autoscaling.backend.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.backend.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.backend.targetCPUUtilizationPercentage }}
{{- end }}
